<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassDrop — Publish Assignment PDFs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .drop-active { border-color: #2563eb !important; background-color: #eff6ff !important; }
  </style>
</head>
<body class="min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-6 sm:p-8 border-b border-slate-100">
      <h1 class="text-xl font-extrabold text-slate-900">Publish Assignment PDFs</h1>
      <p class="text-sm text-slate-600 mt-1">Drop PDF assignments here to share them into <b>Shared Docs</b> or a specific student's folder.</p>
    </div>

    <form id="publishForm" class="p-6 sm:p-8 space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Instructor ID</label>
          <input id="teacherId" type="text" required value="cvms1122" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm mono" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Instructor Passcode</label>
          <input id="teacherPass" type="password" required placeholder="Enter passcode" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm mono" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Assignment Folder</label>
          <input id="assignmentName" type="text" required value="Assignment-01" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm mono" />
        </div>
        <div>
          <label for="targetStudent" class="block text-sm font-semibold text-slate-700 mb-1">Share With Student</label>
          <select id="targetStudent" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
            <option value="all">All Students — Shared Docs</option>
            <option value="dhriti">Dhriti — OEL-M01_Dhriti</option>
            <option value="jainesh">Jainesh — OEL-M02_Jainesh</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Drop Assignment PDF(s)</label>
        <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-400 transition">
          <input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple class="hidden" />
          <p class="text-sm font-semibold text-slate-800">Click or drag &amp; drop PDF files here</p>
          <p class="text-xs text-slate-500 mt-1">Only .pdf files are published to the selected folder</p>
        </div>
        <ul id="pdfList" class="mt-3 space-y-2 hidden"></ul>
      </div>

      <div id="pubStatus" class="hidden rounded-xl p-4 text-sm"></div>

      <button id="publishBtn" type="submit" class="w-full py-3 px-5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition">
        Publish PDFs to Student Portal
      </button>
    </form>
  </div>

  <script>
    const REPO = 'cvms12/classdrop-submissions-2026';
    const RELAY = 'https://script.google.com/macros/s/AKfycbwQIr2QC8Gm1vD9HkH7IBrbht3pHESIfIjJSHZVbG0GaFSUNWFFpU86cvTCrslzAAim/exec';

    const dropZone = document.getElementById('dropZone');
    const pdfInput = document.getElementById('pdfInput');
    const pdfListEl = document.getElementById('pdfList');
    const pubStatus = document.getElementById('pubStatus');
    const publishBtn = document.getElementById('publishBtn');
    let queuedPdfs = [];

    dropZone.addEventListener('click', () => pdfInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drop-active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drop-active');
      const dtFiles = e && e.dataTransfer && e.dataTransfer.files ? Array.from(e.dataTransfer.files) : [];
      addPdfs(dtFiles);
    });
    pdfInput.addEventListener('change', (e) => {
      const picked = e && e.target && e.target.files
        ? Array.from(e.target.files)
        : (pdfInput.files ? Array.from(pdfInput.files) : []);
      addPdfs(picked);
      pdfInput.value = '';
    });

    function addPdfs(files) {
      for (const f of files) {
        const isPdf = f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf');
        if (!isPdf) {
          showPubStatus(`Skipped "${f.name}" — please drop PDF files only.`, 'error');
          continue;
        }
        if (!queuedPdfs.some(x => x.name === f.name && x.size === f.size)) {
          queuedPdfs.push(f);
        }
      }
      renderPdfs();
    }

    function removePdf(i) {
      queuedPdfs.splice(i, 1);
      renderPdfs();
    }

    function renderPdfs() {
      if (!queuedPdfs.length) {
        pdfListEl.classList.add('hidden');
        pdfListEl.innerHTML = '';
        return;
      }
      pdfListEl.classList.remove('hidden');
      pdfListEl.innerHTML = queuedPdfs.map((f, i) => `
        <li class="flex items-center justify-between px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm">
          <span class="font-medium text-slate-800 truncate">${f.name}</span>
          <button type="button" onclick="removePdf(${i})" class="text-xs font-semibold text-rose-600">Remove</button>
        </li>
      `).join('');
    }

    function showPubStatus(msg, type) {
      pubStatus.className = 'rounded-xl p-4 text-sm border ' + (
        type === 'success'
          ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
          : 'bg-rose-50 text-rose-800 border-rose-200'
      );
      pubStatus.innerHTML = msg;
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve((r.result || '').split(',')[1] || '');
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    document.getElementById('publishForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!queuedPdfs.length) {
        showPubStatus('Please drop at least one PDF file first.', 'error');
        return;
      }
      publishBtn.disabled = true;
      publishBtn.textContent = 'Publishing PDFs...';
      try {
        const files = [];
        for (const f of queuedPdfs) {
          files.push({ name: f.name, size: f.size, contentBase64: await toBase64(f) });
        }
        const targetStudent = document.getElementById('targetStudent').value;
        const res = await fetch(RELAY, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            mode: 'publishAssignment',
            repo: REPO,
            assignment: document.getElementById('assignmentName').value.trim(),
            targetStudent,
            teacherId: document.getElementById('teacherId').value.trim(),
            teacherPass: document.getElementById('teacherPass').value,
            files
          })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Publish failed');
        const destLabel = data.targetStudent ? ` for <b>${data.targetStudent}</b>` : '';
        showPubStatus(`Published to <b>${data.folder}</b>${destLabel}.`, 'success');
        queuedPdfs = [];
        renderPdfs();
      } catch (err) {
        showPubStatus(`Publish failed: ${err.message}`, 'error');
      } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = 'Publish PDFs to Student Portal';
      }
    });
  </script>
</body>
</html>
